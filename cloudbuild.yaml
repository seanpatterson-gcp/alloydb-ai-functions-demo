steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/alloydb-ai-frontend:$COMMIT_SHA', '.']

  # 2. Push image to Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/alloydb-ai-frontend:$COMMIT_SHA']

  # 3. Deploy container image to Cloud Run in us-west4 (Las Vegas)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'alloydb-ai-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/alloydb-ai-frontend:$COMMIT_SHA'
      - '--region'
      - 'us-west4'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'GCP_PROJECT=$PROJECT_ID,ALLOYDB_REGION=us-west4,ALLOYDB_CLUSTER=alloydb-ai-cluster,ALLOYDB_INSTANCE=projects/$PROJECT_ID/locations/us-west4/clusters/alloydb-ai-cluster/instances/alloydb-ai-primary,ALLOYDB_DATABASE=postgres'

images:
  - 'gcr.io/$PROJECT_ID/alloydb-ai-frontend:$COMMIT_SHA'
